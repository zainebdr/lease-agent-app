[alembic]
script_location = alembic

# sqlalchemy.url is intentionally left blank here - alembic/env.py sets it
# at runtime from app.config.DATABASE_URL, the same setting the app itself
# uses (see app/db/base.py), so there is exactly one place a database URL
# is configured, not two that can drift apart.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
