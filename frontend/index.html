<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lease &amp; Property Issue Agent</title>
<style>
  :root {
    --bg: #f7f7f8;
    --panel: #ffffff;
    --border: #e2e2e6;
    --text: #1c1c1f;
    --muted: #6b6b74;
    --accent: #2f5fda;
    --accent-hover: #24449e;
    --ok: #1a7f37;
    --ok-bg: #e6f6ea;
    --fail: #c22b2b;
    --fail-bg: #fbe9e9;
    --warn: #8a6d00;
    --warn-bg: #fbf3d6;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    gap: 24px;
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  nav { display: flex; gap: 8px; }
  nav button {
    background: none;
    border: 1px solid transparent;
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
    color: var(--muted);
  }
  nav button.active { background: var(--accent); color: #fff; }
  nav button:not(.active):hover { background: var(--border); color: var(--text); }
  main { max-width: 960px; margin: 0 auto; padding: 24px; }
  .view[hidden] { display: none; }
  h2 { font-size: 20px; margin: 0 0 16px; }
  h3 { font-size: 15px; margin: 0 0 8px; }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 18px;
    margin-bottom: 16px;
  }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); font-size: 14px; }
  th { color: var(--muted); font-weight: 500; }
  tr.clickable { cursor: pointer; }
  tr.clickable:hover { background: var(--bg); }
  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
  }
  .badge-ok { background: var(--ok-bg); color: var(--ok); }
  .badge-fail { background: var(--fail-bg); color: var(--fail); }
  .badge-warn { background: var(--warn-bg); color: var(--warn); }
  .badge-muted { background: var(--border); color: var(--muted); }
  .muted { color: var(--muted); }
  .back-link {
    background: none; border: none; color: var(--accent); cursor: pointer;
    font-size: 14px; padding: 0; margin-bottom: 16px; display: inline-block;
  }
  .back-link:hover { text-decoration: underline; }
  .empty-state { color: var(--muted); font-size: 14px; padding: 8px 0; }
  .field-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--border); }
  .field-row:last-child { border-bottom: none; }
  .field-name { font-weight: 500; font-size: 13px; color: var(--muted); min-width: 160px; }
  .field-value { flex: 1; font-size: 14px; }
  .field-meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .rule-row { display: flex; gap: 10px; align-items: flex-start; padding: 6px 0; font-size: 13px; }
  .rule-id { font-weight: 600; min-width: 28px; }
  form.inline { display: flex; flex-direction: column; gap: 10px; max-width: 420px; }
  input[type="text"], input[type="file"], select {
    padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 14px;
  }
  button.primary {
    background: var(--accent); color: #fff; border: none; padding: 8px 16px;
    border-radius: 6px; cursor: pointer; font-size: 14px;
  }
  button.primary:hover { background: var(--accent-hover); }
  button.primary:disabled { opacity: 0.5; cursor: not-allowed; }
  .error-banner {
    background: var(--fail-bg); color: var(--fail); border-radius: 6px;
    padding: 10px 12px; font-size: 13px; margin-bottom: 12px;
  }
  .photo-thumb { max-width: 140px; max-height: 100px; border-radius: 6px; border: 1px solid var(--border); }
  .edit-input { padding: 6px 8px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; width: 100%; max-width: 260px; }
</style>
</head>
<body>

<header>
  <h1>Lease &amp; Property Issue Agent</h1>
  <nav>
    <button data-view="units-view" class="active">Units</button>
    <button data-view="upload-lease-view">Upload Lease</button>
    <button data-view="report-issue-view">Report Issue</button>
  </nav>
</header>

<main>

  <section id="units-view" class="view">
    <h2>Units</h2>
    <div id="units-error"></div>
    <div class="card">
      <table id="units-table">
        <thead>
          <tr><th>Unit</th><th>Building</th><th>Type</th><th>Status</th></tr>
        </thead>
        <tbody id="units-tbody">
          <tr><td colspan="4" class="empty-state">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </section>

  <section id="unit-detail-view" class="view" hidden>
    <button class="back-link" data-back-to="units-view">&larr; Back to units</button>
    <h2 id="unit-detail-title"></h2>
    <div id="unit-detail-error"></div>
    <div id="unit-detail-content"></div>
  </section>

  <section id="upload-lease-view" class="view" hidden>
    <h2>Upload a Lease</h2>
    <p class="muted">Plain-text lease documents only in this build.</p>
    <div class="card">
      <form class="inline" id="upload-lease-form">
        <input type="file" id="lease-file" accept=".txt" required>
        <button type="submit" class="primary">Upload &amp; Extract</button>
      </form>
    </div>
    <div id="lease-upload-error"></div>
    <div id="lease-result"></div>
  </section>

  <section id="report-issue-view" class="view" hidden>
    <h2>Report a Property Issue</h2>
    <p class="muted">Upload one or more photos of the unit; the agent assesses condition and drafts a work order.</p>
    <div class="card">
      <form class="inline" id="report-issue-form">
        <select id="issue-unit-select" required>
          <option value="">Select a unit…</option>
        </select>
        <input type="text" id="issue-reported-by" placeholder="Reported by (optional)">
        <input type="file" id="issue-files" accept="image/*" multiple required>
        <button type="submit" class="primary">Upload &amp; Assess</button>
      </form>
    </div>
    <div id="issue-upload-error"></div>
    <div id="issue-result"></div>
  </section>

</main>

<script>
const API_BASE = "http://localhost:8000";

// ---------------------------------------------------------------------
// View switching - deliberately no router/framework: three sections,
// toggled by hiding/showing. Enough for three screens; would be the
// first thing to replace with something real if this grew past that.
// ---------------------------------------------------------------------
let currentUnitId = null;

function showView(id) {
  document.querySelectorAll(".view").forEach(v => v.hidden = (v.id !== id));
  document.querySelectorAll("nav button").forEach(b => {
    b.classList.toggle("active", b.dataset.view === id);
  });
}

document.querySelectorAll("nav button[data-view]").forEach(btn => {
  btn.addEventListener("click", () => {
    showView(btn.dataset.view);
    if (btn.dataset.view === "units-view") loadUnits();
    if (btn.dataset.view === "report-issue-view") populateUnitSelect();
  });
});

document.querySelectorAll("[data-back-to]").forEach(btn => {
  btn.addEventListener("click", () => {
    showView(btn.dataset.backTo);
    loadUnits();
  });
});

// ---------------------------------------------------------------------
// Fetch helper - surfaces API errors (FastAPI's {"detail": "..."} shape)
// as readable text instead of a silent failure or a raw stack trace.
// ---------------------------------------------------------------------
async function api(path, opts = {}) {
  const res = await fetch(`${API_BASE}${path}`, opts);
  if (!res.ok) {
    let detail = res.statusText;
    try {
      const body = await res.json();
      detail = body.detail || JSON.stringify(body);
    } catch (_) { /* response wasn't JSON - keep statusText */ }
    throw new Error(`${res.status}: ${detail}`);
  }
  return res.json();
}

function showError(containerId, err) {
  const el = document.getElementById(containerId);
  el.innerHTML = `<div class="error-banner">${escapeHtml(err.message || String(err))}
    ${err.message && err.message.includes("Failed to fetch")
      ? `<br>Is the backend running at ${API_BASE}? (<code>uvicorn app.main:app --reload</code> from the backend/ folder)`
      : ""}
    </div>`;
}
function clearError(containerId) { document.getElementById(containerId).innerHTML = ""; }

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str ?? "";
  return div.innerHTML;
}

// escapeHtml is only safe for HTML TEXT content - it does not escape
// quote characters, which matter only inside an attribute value. Use
// this one instead whenever a value is being placed inside a "..."
// HTML attribute (data-current-value, alt text, etc).
function escapeAttr(str) {
  return String(str ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// ---------------------------------------------------------------------
// Badges
// ---------------------------------------------------------------------
function statusBadge(status) {
  const cls = status === "occupied" ? "badge-warn" : "badge-ok";
  return `<span class="badge ${cls}">${escapeHtml(status)}</span>`;
}
function ruleResultBadge(result) {
  const cls = result === "PASS" ? "badge-ok" : result === "FAIL" ? "badge-fail" : "badge-muted";
  return `<span class="badge ${cls}">${escapeHtml(result)}</span>`;
}
function reviewBadge(state) {
  const map = { accepted: "badge-ok", edited: "badge-ok", rejected: "badge-fail", pending: "badge-muted" };
  return `<span class="badge ${map[state] || "badge-muted"}">${escapeHtml(state)}</span>`;
}

// ---------------------------------------------------------------------
// Units list
// ---------------------------------------------------------------------
async function loadUnits() {
  clearError("units-error");
  const tbody = document.getElementById("units-tbody");
  tbody.innerHTML = `<tr><td colspan="4" class="empty-state">Loading…</td></tr>`;
  try {
    const units = await api("/units");
    if (!units.length) {
      tbody.innerHTML = `<tr><td colspan="4" class="empty-state">No units found.</td></tr>`;
      return;
    }
    tbody.innerHTML = units.map(u => `
      <tr class="clickable" data-unit-id="${escapeHtml(u.unit_id)}">
        <td>${escapeHtml(u.label)} <span class="muted">(${escapeHtml(u.unit_id)})</span></td>
        <td>${escapeHtml(u.building_name)}</td>
        <td>${escapeHtml(u.type || "-")}</td>
        <td>${statusBadge(u.status)}</td>
      </tr>
    `).join("");
    tbody.querySelectorAll("tr[data-unit-id]").forEach(row => {
      row.addEventListener("click", () => openUnitDetail(row.dataset.unitId));
    });
  } catch (err) {
    tbody.innerHTML = "";
    showError("units-error", err);
  }
}

async function populateUnitSelect() {
  const select = document.getElementById("issue-unit-select");
  try {
    const units = await api("/units");
    select.innerHTML = `<option value="">Select a unit…</option>` +
      units.map(u => `<option value="${escapeHtml(u.unit_id)}">${escapeHtml(u.label)} (${escapeHtml(u.unit_id)})</option>`).join("");
  } catch (err) {
    showError("issue-upload-error", err);
  }
}

// ---------------------------------------------------------------------
// Unit detail - the screen the brief is actually grading: a unit's
// lease(s) and reported issues, in one place.
// ---------------------------------------------------------------------
async function openUnitDetail(unitId) {
  currentUnitId = unitId;
  showView("unit-detail-view");
  document.getElementById("unit-detail-title").textContent = "Loading…";
  clearError("unit-detail-error");
  try {
    const data = await api(`/units/${encodeURIComponent(unitId)}`);
    renderUnitDetail(data);
  } catch (err) {
    document.getElementById("unit-detail-title").textContent = unitId;
    showError("unit-detail-error", err);
  }
}

function renderUnitDetail(data) {
  const { unit, leases, issues } = data;
  document.getElementById("unit-detail-title").innerHTML =
    `${escapeHtml(unit.label)} <span class="muted">(${escapeHtml(unit.unit_id)})</span> ${statusBadge(unit.status)}`;

  const content = document.getElementById("unit-detail-content");
  content.innerHTML = `
    <div class="card">
      <h3>Unit</h3>
      <div class="field-row"><span class="field-name">Property</span><span class="field-value">${escapeHtml(unit.property_name)} — ${escapeHtml(unit.building_name)}</span></div>
      <div class="field-row"><span class="field-name">Type / area</span><span class="field-value">${escapeHtml(unit.type || "-")} · ${unit.area_sqm ?? "-"} sqm</span></div>
    </div>

    <div class="card">
      <h3>Lease${leases.length !== 1 ? "s" : ""} (${leases.length})</h3>
      ${leases.length ? leases.map(l => renderLeaseCard(l)).join("") : `<div class="empty-state">No lease on file for this unit yet.</div>`}
    </div>

    <div class="card">
      <h3>Reported issues (${issues.length})</h3>
      ${issues.length ? issues.map(i => renderIssueCard(i)).join("") : `<div class="empty-state">No issues reported for this unit.</div>`}
    </div>
  `;
}

// ---------------------------------------------------------------------
// Lease review - accept/reject/edit each extracted field, then finalize.
//
// EDITABLE_LEASE_FIELDS mirrors the whitelist enforced server-side in
// api/leases.py (EDITABLE_LEASE_FIELDS) - kept in sync by hand since
// there's no shared schema file between frontend and backend in this
// build. A field like unit_reference_text is reviewable (accept/reject)
// but not editable, same as the API only allows.
// ---------------------------------------------------------------------
const EDITABLE_LEASE_FIELDS = new Set([
  "landlord_name", "tenant_name", "landlord_signed", "tenant_signed",
  "commencement_date", "expiry_date", "term_months",
  "monthly_rent", "annual_rent", "deposit_amount",
  "escalation_clause_text", "escalation_is_defined",
]);

// Used only client-side, to send edit values as the right JSON type
// (a real boolean/number, not a string) - the API does not currently
// coerce or validate new_value's type against the target column, so
// getting this right here avoids feeding it a value it would silently
// mis-store (e.g. the string "false" is truthy).
const LEASE_FIELD_TYPES = {
  landlord_signed: "boolean", tenant_signed: "boolean", escalation_is_defined: "boolean",
  term_months: "number", monthly_rent: "number", annual_rent: "number", deposit_amount: "number",
  commencement_date: "date", expiry_date: "date",
};

function currentFieldValue(lease, key) {
  if (Object.prototype.hasOwnProperty.call(lease, key)) return lease[key];
  const ef = lease.extracted_fields[key];
  return ef ? ef.value : null;
}

// Renders one extracted-field row. `editing` swaps the read-only value +
// Accept/Reject/Edit controls for an inline input + Save/Cancel - no
// popups, no full-card reload just to type a correction.
function renderLeaseFieldRow(lease, key, isDraft, editing) {
  const ef = lease.extracted_fields[key] || {};
  const value = currentFieldValue(lease, key);
  const reviewState = lease.review_status[key] || "pending";
  const editable = EDITABLE_LEASE_FIELDS.has(key);
  const type = LEASE_FIELD_TYPES[key] || "text";

  let valueHtml;
  if (editing) {
    if (type === "boolean") {
      valueHtml = `<select class="edit-input" data-edit-input>
        <option value="true" ${value ? "selected" : ""}>true</option>
        <option value="false" ${!value ? "selected" : ""}>false</option>
      </select>`;
    } else {
      const inputType = type === "number" ? "number" : type === "date" ? "date" : "text";
      valueHtml = `<input type="${inputType}" class="edit-input" data-edit-input
        ${type === "number" ? 'step="any"' : ""}
        value="${escapeAttr(value == null ? "" : String(value))}">`;
    }
  } else {
    valueHtml = `
      ${escapeHtml(value === null || value === undefined ? "—" : String(value))}
      <div class="field-meta">
        ${ef.source_span ? `source: ${escapeHtml(ef.source_span)} &middot; ` : ""}${ef.confidence != null ? `confidence ${Number(ef.confidence).toFixed(2)} &middot; ` : ""}${reviewBadge(reviewState)}
      </div>`;
  }

  let actionsHtml = "";
  if (isDraft && editing) {
    actionsHtml = `
      <div class="field-actions">
        <button type="button" data-lease-action="save-edit" data-field="${escapeAttr(key)}">Save</button>
        <button type="button" data-lease-action="cancel-edit" data-field="${escapeAttr(key)}">Cancel</button>
      </div>`;
  } else if (isDraft) {
    actionsHtml = `
      <div class="field-actions">
        <button type="button" data-lease-action="accept" data-field="${escapeAttr(key)}">Accept</button>
        <button type="button" data-lease-action="reject" data-field="${escapeAttr(key)}">Reject</button>
        ${editable ? `<button type="button" data-lease-action="edit" data-field="${escapeAttr(key)}">Edit</button>` : ""}
      </div>`;
  }

  return `
    <div class="field-row" data-field-row="${escapeAttr(key)}">
      <span class="field-name">${escapeHtml(key)}</span>
      <span class="field-value">${valueHtml}</span>
      ${actionsHtml}
    </div>
  `;
}

function renderLeaseCard(lease) {
  const fieldKeys = Object.keys(lease.review_status || {});
  const isDraft = lease.status === "draft";
  const pendingCount = fieldKeys.filter(k => lease.review_status[k] === "pending").length;

  const fieldsHtml = fieldKeys.map(key => renderLeaseFieldRow(lease, key, isDraft, false)).join("");

  const rulesHtml = (lease.rule_checks || []).map(rc => `
    <div class="rule-row">
      <span class="rule-id">${escapeHtml(rc.rule_id)}</span>
      ${ruleResultBadge(rc.result)}
      <span>${escapeHtml(rc.description || "")} <span class="muted">- ${escapeHtml(rc.reason || "")}</span></span>
    </div>
  `).join("");

  // The lease's own JSON is stashed on the card so edit/cancel-edit can
  // re-render a single field row without an extra round trip to the API
  // just to redraw a form - only actions that change state (accept,
  // reject, save-edit, accept-all, finalize) actually call the server.
  return `
    <div data-lease-card="${lease.id}" class="lease-card" data-lease="${escapeAttr(JSON.stringify(lease))}">
      <div class="field-row">
        <span class="field-name">Lease #${lease.id}</span>
        <span class="field-value">${escapeHtml(lease.source_document_name)} ${reviewBadge(lease.status)}</span>
      </div>
      <h4>Extracted fields</h4>
      ${fieldsHtml || `<div class="empty-state">No fields extracted.</div>`}
      <h4>Rule checks</h4>
      ${rulesHtml || `<div class="empty-state">No rule checks recorded.</div>`}
      ${isDraft ? `
        <div class="field-actions" style="margin-top:12px;">
          ${pendingCount > 0 ? `<button type="button" data-lease-action="accept-all">Accept all pending (${pendingCount})</button>` : ""}
          <button type="button" class="primary" data-lease-action="finalize" ${pendingCount > 0 ? "disabled" : ""} ${pendingCount > 0 ? `title="Resolve all ${pendingCount} pending field(s) first"` : ""}>Finalize</button>
        </div>
        ${pendingCount > 0 ? `<div class="field-meta" style="margin-top:6px;">${pendingCount} field(s) still pending - accept, reject, or edit them (or use "Accept all pending") before you can finalize.</div>` : ""}
      ` : ""}
    </div>
  `;
}

// ---------------------------------------------------------------------
// Issue / work order review - accept, reject, or edit-then-accept the
// drafted work order as a whole (not per-field like a lease - the brief
// asks for each *draft work order* to be reviewed, matching how the API
// treats it: POST /issues/{id}/review takes one action for the whole
// draft, plus optional title/description edits applied first).
// ---------------------------------------------------------------------
function renderIssueCard(issue) {
  const wo = issue.work_order;
  const isDraft = wo && wo.status === "draft";

  const photosHtml = (issue.photos || []).map(p => `
    <div class="field-row">
      <img class="photo-thumb" src="${API_BASE}/uploads/${encodeURIComponent(p.file_path)}"
           alt="${escapeAttr(p.file_path)}" onerror="this.style.display='none'">
      <span class="field-value">
        <div>${escapeHtml(p.condition_assessment || "-")}</div>
        <div class="field-meta">
          contents: ${escapeHtml((p.contents_detected || []).join(", ") || "none noted")}
          ${p.damage_notes ? ` &middot; ${escapeHtml(p.damage_notes)}` : ""}
          &middot; confidence ${p.confidence != null ? Number(p.confidence).toFixed(2) : "-"}
          &middot; assessed by ${escapeHtml(p.assessed_by || "-")}
        </div>
      </span>
    </div>
  `).join("");

  const woHtml = wo ? `
    <div class="field-row"><span class="field-name">Title</span><span class="field-value">${escapeHtml(wo.title)}</span></div>
    <div class="field-row"><span class="field-name">Description</span><span class="field-value">${escapeHtml(wo.description)}</span></div>
    <div class="field-row"><span class="field-name">Status</span><span class="field-value">${reviewBadge(wo.status)}</span></div>
    ${isDraft ? `
      <div class="field-actions">
        <button type="button" data-issue-action="edit-title" data-current-title="${escapeAttr(wo.title)}">Edit title</button>
        <button type="button" data-issue-action="edit-description" data-current-description="${escapeAttr(wo.description)}">Edit description</button>
        <button type="button" class="primary" data-issue-action="accept">Accept</button>
        <button type="button" data-issue-action="reject">Reject</button>
      </div>
    ` : ""}
  ` : `<div class="empty-state">No work order drafted.</div>`;

  return `
    <div data-issue-card="${issue.id}" class="lease-card">
      <div class="field-row">
        <span class="field-name">Issue #${issue.id}</span>
        <span class="field-value">${escapeHtml(issue.condition_summary || "-")} ${reviewBadge(issue.status)}</span>
      </div>
      <div class="field-row">
        <span class="field-name">Contents / equipment</span>
        <span class="field-value">${escapeHtml((issue.contents_summary || []).join(", ") || "none noted")}</span>
      </div>
      <h4>Photos (${(issue.photos || []).length})</h4>
      ${photosHtml || `<div class="empty-state">No photos.</div>`}
      <h4>Draft work order</h4>
      ${woHtml}
    </div>
  `;
}

async function submitIssueReview(issueId, payload) {
  return api(`/issues/${issueId}/review`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload),
  });
}

document.addEventListener("click", async (e) => {
  const btn = e.target.closest("[data-issue-action]");
  if (!btn) return;
  const wrapper = btn.closest("[data-issue-card]");
  if (!wrapper) return;
  const issueId = wrapper.dataset.issueCard;
  const action = btn.dataset.issueAction;

  let payload = {};
  if (action === "accept" || action === "reject") {
    payload = { action };
  } else if (action === "edit-title") {
    const newTitle = window.prompt("New title:", btn.dataset.currentTitle ?? "");
    if (newTitle === null) return;
    payload = { title: newTitle };
  } else if (action === "edit-description") {
    const newDescription = window.prompt("New description:", btn.dataset.currentDescription ?? "");
    if (newDescription === null) return;
    payload = { description: newDescription };
  }

  try {
    const updated = await submitIssueReview(issueId, payload);
    // Same reasoning as the lease finalize handler: if we're on the
    // unit detail screen, a full refresh keeps everything (not just
    // this card) consistent with the latest state.
    if (currentUnitId && !document.getElementById("unit-detail-view").hidden) {
      await openUnitDetail(currentUnitId);
    } else {
      wrapper.outerHTML = renderIssueCard(updated);
    }
  } catch (err) {
    alert(err.message);
  }
});

document.getElementById("report-issue-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  clearError("issue-upload-error");
  const unitId = document.getElementById("issue-unit-select").value;
  const reportedBy = document.getElementById("issue-reported-by").value.trim();
  const files = document.getElementById("issue-files").files;
  if (!unitId || !files.length) return;

  const formData = new FormData();
  formData.append("unit_id", unitId);
  if (reportedBy) formData.append("reported_by", reportedBy);
  for (const f of files) formData.append("files", f);

  const resultEl = document.getElementById("issue-result");
  resultEl.innerHTML = `<div class="empty-state">Uploading and assessing\u2026</div>`;
  try {
    const issue = await api("/issues/upload", { method: "POST", body: formData });
    resultEl.innerHTML = `<div class="card">${renderIssueCard(issue)}</div>`;
  } catch (err) {
    resultEl.innerHTML = "";
    showError("issue-upload-error", err);
  }
});


async function submitLeaseReview(leaseId, payload) {
  return api(`/leases/${leaseId}/review`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload),
  });
}

// Single delegated listener for every rendered lease card, wherever it
// appears (upload result or unit detail) - simpler than re-attaching
// per-render handlers, and correct either way since the DOM nodes are
// replaced wholesale after each action.
//
// "edit" and "cancel-edit" are pure client-side UI toggles - no API
// call, just re-rendering that one field row from the lease JSON
// already stashed on the card. Everything else (accept, reject,
// save-edit, accept-all, finalize) calls the review API and then
// either refreshes the whole unit view (finalize can change the
// unit's own status) or just swaps in the updated card.
document.addEventListener("click", async (e) => {
  const btn = e.target.closest("[data-lease-action]");
  if (!btn) return;
  const wrapper = btn.closest("[data-lease-card]");
  if (!wrapper) return;
  const leaseId = wrapper.dataset.leaseCard;
  const action = btn.dataset.leaseAction;
  const field = btn.dataset.field;
  const lease = JSON.parse(wrapper.dataset.lease);
  const rowSelector = field ? `[data-field-row="${CSS.escape(field)}"]` : null;

  if (action === "edit" || action === "cancel-edit") {
    const row = wrapper.querySelector(rowSelector);
    const editing = action === "edit";
    row.outerHTML = renderLeaseFieldRow(lease, field, lease.status === "draft", editing);
    if (editing) {
      const input = wrapper.querySelector(`${rowSelector} [data-edit-input]`);
      input.focus();
      input.addEventListener("keydown", (ev) => {
        if (ev.key === "Enter") {
          ev.preventDefault();
          wrapper.querySelector(`${rowSelector} [data-lease-action="save-edit"]`).click();
        } else if (ev.key === "Escape") {
          wrapper.querySelector(`${rowSelector} [data-lease-action="cancel-edit"]`).click();
        }
      });
    }
    return;
  }

  let payload;
  if (action === "finalize") {
    if (btn.disabled) return;
    payload = { field_actions: [], finalize: true };
  } else if (action === "accept-all") {
    const pendingFields = Object.entries(lease.review_status)
      .filter(([, state]) => state === "pending")
      .map(([key]) => key);
    payload = { field_actions: pendingFields.map(f => ({ field_name: f, action: "accept" })) };
  } else if (action === "save-edit") {
    const type = LEASE_FIELD_TYPES[field] || "text";
    const inputEl = wrapper.querySelector(`${rowSelector} [data-edit-input]`);
    let newValue = inputEl.value;
    if (type === "boolean") newValue = newValue === "true";
    else if (type === "number") newValue = newValue === "" ? null : Number(newValue);
    payload = { field_actions: [{ field_name: field, action: "edit", new_value: newValue }] };
  } else {
    // accept / reject
    payload = { field_actions: [{ field_name: field, action }] };
  }

  try {
    const updated = await submitLeaseReview(leaseId, payload);
    // Finalize can change the unit's own status (draft -> accepted flips
    // the unit to occupied) - if we're looking at the unit detail screen,
    // refresh the whole thing so that badge stays correct too, not just
    // this one lease card.
    if (action === "finalize" && currentUnitId && !document.getElementById("unit-detail-view").hidden) {
      await openUnitDetail(currentUnitId);
    } else {
      wrapper.outerHTML = renderLeaseCard(updated);
    }
  } catch (err) {
    alert(err.message);
  }
});

document.getElementById("upload-lease-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  clearError("lease-upload-error");
  const fileInput = document.getElementById("lease-file");
  if (!fileInput.files.length) return;

  const formData = new FormData();
  formData.append("file", fileInput.files[0]);

  const resultEl = document.getElementById("lease-result");
  resultEl.innerHTML = `<div class="empty-state">Uploading and extracting\u2026</div>`;
  try {
    const lease = await api("/leases/upload", { method: "POST", body: formData });
    resultEl.innerHTML = `<div class="card">${renderLeaseCard(lease)}</div>`;
  } catch (err) {
    resultEl.innerHTML = "";
    showError("lease-upload-error", err);
  }
});
